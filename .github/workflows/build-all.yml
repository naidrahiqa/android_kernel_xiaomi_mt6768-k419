name: build-all

on:
  push:
    branches: [PawwwNunungggg24.0]
    paths-ignore:
      - '**.md'
      - '.opencode/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '-1004414006944' }}
      TELEGRAM_TOPIC_CI: "47"
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1003752197403' }}
      KCK_SOURCE_REPO: naidrahiqa/android_kernel_xiaomi_mt6768-k419
      KCK_SOURCE_BRANCH: PawwwNunungggg24.0
      KCK_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout kernel-ci-kit
        uses: actions/checkout@v4
        with:
          repository: naidrahiqa/kernel-ci-kit
          ref: main
          path: kit

      - name: Setup toolchain
        run: '"${{ github.workspace }}/kit/scripts/setup-toolchain.sh"'
        env:
          TOOLCHAIN: greenforce-clang

      - name: Build all 4 variants
        run: bash scripts/ci/build-all.sh
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_OUTPUT: ${{ github.output }}

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_OUTPUT: ${{ github.output }}
        run: bash scripts/ci/release.sh

      - name: Notify Telegram
        if: success()
        run: |
          ./kit/scripts/notify-telegram.sh success "Release R$(printf %02d $(gh api repos/naidrahiqa/selene-releases/releases --paginate --jq '.[].tag_name' 2>/dev/null | grep -E '^R[0-9]+$' | sed 's/R//' | sort -n | tail -1)) created with 4 variants"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '-1004414006944' }}
          TELEGRAM_TOPIC_CI: "47"
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1003752197403' }}
          KCK_SOURCE_REPO: naidrahiqa/android_kernel_xiaomi_mt6768-k419
          KCK_SOURCE_BRANCH: PawwwNunungggg24.0
          KCK_SOURCE_SHA: ${{ github.sha }}
