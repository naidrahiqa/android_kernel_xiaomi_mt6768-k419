name: multibuild

on:
  push:
    branches: [PawwwNunungggg24.0]
    paths-ignore:
      - '**.md'
      - '.opencode/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multibuild-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: xxksu-nomount
            config_overrides: ""
            zip_suffix: "xxksu-nomount"
          - variant: xxksu
            config_overrides: "CONFIG_NOMOUNT=n"
            zip_suffix: "xxksu"
          - variant: bakasu-nomount
            config_overrides: "CONFIG_KSU_XXKSU=n CONFIG_KSU_BAKASU=y CONFIG_KSU_MANUAL_HOOK=y CONFIG_KSU_HOSTSREDIRECT=y"
            zip_suffix: "bakasu-nomount"
          - variant: bakasu
            config_overrides: "CONFIG_KSU_XXKSU=n CONFIG_KSU_BAKASU=y CONFIG_KSU_MANUAL_HOOK=y CONFIG_KSU_HOSTSREDIRECT=y CONFIG_NOMOUNT=n"
            zip_suffix: "bakasu"
    uses: naidrahiqa/kernel-ci-kit/.github/workflows/example-build.yml@main
    with:
      kernel_repo: naidrahiqa/android_kernel_xiaomi_mt6768-k419
      kernel_ref: PawwwNunungggg24.0
      defconfig: selene_defconfig
      device_name: selene
      toolchain: greenforce-clang
      extra_make_args: "LLVM=1 LLVM_IAS=1"
      config_overrides: ${{ matrix.config_overrides }}
      zip_name_template: 'PawwwNunungggg-${{ matrix.zip_suffix }}-R${{ github.run_number }}-{hash}-{date}'
    secrets: inherit

  release:
    needs: build
    if: success()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PawwwNunungggg-*-R${{ github.run_number }}-*-*.zip
          path: artifacts/
          merge-multiple: true

      - name: Determine release number (R##)
        id: relnum
        run: |
          releases=$(gh api repos/naidrahiqa/selene-releases/releases --paginate --jq '.[].tag_name' 2>/dev/null || echo "")
          max_num=0
          for tag in $releases; do
            if [[ $tag =~ ^R([0-9]+)$ ]]; then
              num=${BASH_REMATCH[1]}
              if [ $num -gt $max_num ]; then
                max_num=$num
              fi
            fi
          done
          next=$((max_num + 1))
          printf "num=%02d\n" "$next" >> "$GITHUB_OUTPUT"
          printf "tag=R%02d\n" "$next" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: notes
        run: |
          KERNEL_VER="4.19.325-PawwwNunungggg-cip136-st20"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:8}"
          DATE_UTC=$(date -u '+%Y-%m-%d %H:%M UTC')
          
          cat > release-notes.md <<NOTES
## PawwwNunungggg ${{ steps.relnum.outputs.tag }}

**Kernel:** \`${KERNEL_VER}\`  
**Commit:** \`${COMMIT_SHORT}\` (PawwwNunungggg24.0)  
**Date:** ${DATE_UTC}  
**Toolchain:** Greenforce Clang 24.0.0

### Root Drivers
- **xxKSU** \`v3.3.0-70\` · \`KSU_VERSION=32670\` · UAPI v5
- **BakaSU** \`v4.2.0-rc3\` · \`KSU_VERSION=35223\` · manual hook

### Variants (4 assets)
| Asset | Driver | NoMount | Size |
|---|---|---|---|
| \`PawwwNunungggg-xxksu-nomount-R${{ github.run_number }}-*.zip\` | xxKSU | ✅ | ~15 MB |
| \`PawwwNunungggg-xxksu-R${{ github.run_number }}-*.zip\` | xxKSU | ❌ | ~15 MB |
| \`PawwwNunungggg-bakasu-nomount-R${{ github.run_number }}-*.zip\` | BakaSU | ✅ | ~15 MB |
| \`PawwwNunungggg-bakasu-R${{ github.run_number }}-*.zip\` | BakaSU | ❌ | ~15 MB |

### Changelog
*(auto dari CHANGELOG.md header terbaru)*
NOTES
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create ${{ steps.relnum.outputs.tag }} \
            --repo naidrahiqa/selene-releases \
            --title "${{ steps.relnum.outputs.tag }}" \
            --notes-file release-notes.md \
            artifacts/*.zip

      - name: Notify Telegram (release created)
        if: success()
        run: |
          ./kit/scripts/notify-telegram.sh success "Release ${{ steps.relnum.outputs.tag }} created with 4 variants"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '-1004414006944' }}
          TELEGRAM_TOPIC_CI: "47"
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1003752197403' }}
          KCK_SOURCE_REPO: naidrahiqa/android_kernel_xiaomi_mt6768-k419
          KCK_SOURCE_BRANCH: PawwwNunungggg24.0
          KCK_SOURCE_SHA: ${{ github.sha }}
