name: build-bakasu-nomount
on:
  push:
    branches: [PawwwNunungggg24.0]
    paths-ignore:
      - '**.md'
      - '.opencode/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-bakasu-nomount-${{ github.ref }}-${{ github.event_name }}
jobs:
  build:
    uses: naidrahiqa/kernel-ci-kit/.github/workflows/example-build.yml@main
    with:
      kernel_repo: naidrahiqa/android_kernel_xiaomi_mt6768-k419
      kernel_ref: PawwwNunungggg24.0
      defconfig: selene_defconfig
      device_name: selene
      toolchain: greenforce-clang
      extra_make_args: "LLVM=1 LLVM_IAS=1"
      config_overrides: "CONFIG_KSU_XXKSU=n CONFIG_KSU_BAKASU=y CONFIG_KSU_MANUAL_HOOK=y CONFIG_KSU_HOSTSREDIRECT=y"
      zip_name_template: 'PawwwNunungggg-bakasu-nomount-R${{ github.run_number }}-{hash}-{date}'
    secrets: inherit
