name: ReSukiSU Upstream Check

on:
  schedule:
    - cron: '0 2 * * *' # 09:00 WIB
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Cek ReSukiSU upstream
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Jalankan check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OUT="$(bash scripts/check-resukisu.sh 2>&1)"
          CODE=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$CODE" = "2" ]; then
            echo "::warning::ReSukiSU upstream check gagal (jaringan/API/Kbuild)"
          fi
          {
            echo "report<<REPORTEOF"
            printf '%s\n' "$OUT"
            echo "REPORTEOF"
            echo "status=${CODE}"
          } >> "$GITHUB_OUTPUT"

      - name: Step summary
        if: always()
        env:
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          {
            echo "## ReSukiSU upstream check"
            echo '```'
            printf '%s\n' "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Notif HANYA kalau outdated; up-to-date -> senyap (anti-spam)
      - name: Notif Telegram (outdated saja)
        if: steps.check.outputs.status == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '-1004414006944' }}
          REPORT: ${{ steps.check.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN kosong — lewati notif"
            exit 0
          fi
          ESC="$(printf '%s' "$REPORT" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')"
          TEXT="$(printf '<b>🔄 ReSukiSU upstream update</b>\n\n%s\n\n<a href="%s">Detail check</a>' "$ESC" "$RUN_URL")"
          RESP="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_GROUP_ID}" \
            -d "message_thread_id=47" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}")"
          echo "$RESP" | head -c 400
          echo "$RESP" | grep -q '"ok":true'
