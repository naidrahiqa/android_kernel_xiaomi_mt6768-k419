name: multibuild

on:
  push:
    branches: [PawwwNunungggg24.0]
    paths-ignore:
      - '**.md'
      - '.opencode/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multibuild-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout kernel-ci-kit
        uses: actions/checkout@v4
        with:
          repository: naidrahiqa/kernel-ci-kit
          ref: main
          path: kit

      - name: Setup toolchain
        run: '"${{ github.workspace }}/kit/scripts/setup-toolchain.sh"'
        env:
          TOOLCHAIN: greenforce-clang

      - name: Build all 4 variants
        id: build_all
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          mkdir -p artifacts
          
          variants=(
            "xxksu-nomount|||xxksu-nomount"
            "xxksu|CONFIG_NOMOUNT=n|xxksu"
            "bakasu-nomount|CONFIG_KSU_XXKSU=n CONFIG_KSU_BAKASU=y CONFIG_KSU_MANUAL_HOOK=y CONFIG_KSU_HOSTSREDIRECT=y|bakasu-nomount"
            "bakasu|CONFIG_KSU_XXKSU=n CONFIG_KSU_BAKASU=y CONFIG_KSU_MANUAL_HOOK=y CONFIG_KSU_HOSTSREDIRECT=y CONFIG_NOMOUNT=n|bakasu"
          )
          
          for v in "${variants[@]}"; do
            IFS='|' read -r variant config_override zip_suffix <<< "$v"
            echo "=== Building $variant ==="
            
            # Build with kernel-ci-kit scripts
            DEFCONFIG=selene_defconfig \
            EXTRA_MAKE_ARGS="LLVM=1 LLVM_IAS=1" \
            CONFIG_OVERRIDES="$config_override" \
            ARCH=arm64 \
            KERNEL_PATH=. \
            TOOLCHAIN=greenforce-clang \
            USE_CCACHE=true \
            CCACHE_SIZE=2G \
            JOBS=$(nproc) \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            OUT_DIR=out_${variant} \
            BUILD_LOG=build_${variant}.log \
            "${{ github.workspace }}/kit/scripts/build-kernel.sh"
            
            # Package AnyKernel3
            DEVICE_NAME=selene \
            KERNEL_PATH=. \
            KERNEL_VERSION=$(make -s O=out_${variant} ARCH=arm64 kernelrelease 2>>build_${variant}.log | tail -n1) \
            ANYKERNEL_BRANCH=dca9dc3 \
            ZIP_NAME_TEMPLATE="PawwwNunungggg-${zip_suffix}-R${{ github.run_number }}-{hash}-{date}" \
            TOOLCHAIN=greenforce-clang \
            "${{ github.workspace }}/kit/scripts/package-anykernel.sh"
            
            # Move artifacts
            mv "${{ github.workspace }}/"*.zip artifacts/ 2>/dev/null || true
            mv "${{ github.workspace }}/"*.zip.sha256 artifacts/ 2>/dev/null || true
          done
          
          echo "zips=$(ls artifacts/*.zip | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Upload all zips as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multibuild-zips
          path: artifacts/*.zip
          retention-days: 30

      - name: Determine release number (R##)
        id: relnum
        run: |
          releases=$(gh api repos/naidrahiqa/selene-releases/releases --paginate --jq '.[].tag_name' 2>/dev/null || echo "")
          max_num=0
          for tag in $releases; do
            if [[ $tag =~ ^R([0-9]+)$ ]]; then
              num=${BASH_REMATCH[1]}
              if [ $num -gt $max_num ]; then
                max_num=$num
              fi
            fi
          done
          next=$((max_num + 1))
          printf "num=%02d\n" "$next" >> "$GITHUB_OUTPUT"
          printf "tag=R%02d\n" "$next" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: notes
        run: |
          KERNEL_VER="4.19.325-PawwwNunungggg-cip136-st20"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:8}"
          DATE_UTC=$(date -u '+%Y-%m-%d %H:%M UTC')
          
          cat > release-notes.md <<NOTES
## PawwwNunungggg ${{ steps.relnum.outputs.tag }}

**Kernel:** \`${KERNEL_VER}\`  
**Commit:** \`${COMMIT_SHORT}\` (PawwwNunungggg24.0)  
**Date:** ${DATE_UTC}  
**Toolchain:** Greenforce Clang 24.0.0

### Root Drivers
- **xxKSU** \`v3.3.0-70\` · \`KSU_VERSION=32670\` · UAPI v5
- **BakaSU** \`v4.2.0-rc3\` · \`KSU_VERSION=35223\` · manual hook

### Variants (4 assets)
| Asset | Driver | NoMount | Size |
|---|---|---|---|
| \`PawwwNunungggg-xxksu-nomount-R${{ github.run_number }}-*.zip\` | xxKSU | ✅ | ~15 MB |
| \`PawwwNunungggg-xxksu-R${{ github.run_number }}-*.zip\` | xxKSU | ❌ | ~15 MB |
| \`PawwwNunungggg-bakasu-nomount-R${{ github.run_number }}-*.zip\` | BakaSU | ✅ | ~15 MB |
| \`PawwwNunungggg-bakasu-R${{ github.run_number }}-*.zip\` | BakaSU | ❌ | ~15 MB |

### Changelog
*(auto dari CHANGELOG.md header terbaru)*
NOTES
          cat release-notes.md

      - name: Create GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create ${{ steps.relnum.outputs.tag }} \
            --repo naidrahiqa/selene-releases \
            --title "${{ steps.relnum.outputs.tag }}" \
            --notes-file release-notes.md \
            artifacts/*.zip

      - name: Notify Telegram (release created)
        if: success()
        run: |
          ./kit/scripts/notify-telegram.sh success "Release ${{ steps.relnum.outputs.tag }} created with 4 variants"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '-1004414006944' }}
          TELEGRAM_TOPIC_CI: "47"
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1003752197403' }}
          KCK_SOURCE_REPO: naidrahiqa/android_kernel_xiaomi_mt6768-k419
          KCK_SOURCE_BRANCH: PawwwNunungggg24.0
          KCK_SOURCE_SHA: ${{ github.sha }}

