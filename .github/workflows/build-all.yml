name: build-all

on:
  push:
    branches: [PawwwNunungggg24.0]
    paths-ignore:
      - '**.md'
      - '.opencode/**'
  workflow_dispatch:

permissions:
  contents: read

# serialize runs: one R tag at a time, no runner pile-up
concurrency:
  group: multibuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Next release tag (R## via API count)
        id: next
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          releases=$(gh api repos/naidrahiqa/selene-releases/releases --paginate --jq '.[].tag_name' 2>/dev/null || echo "")
          max_num=0
          for tag in $releases; do
            if [[ $tag =~ ^R([0-9]+)$ ]]; then
              num=${BASH_REMATCH[1]}
              if [ "$num" -gt "$max_num" ]; then max_num=$num; fi
            fi
          done
          printf "tag=R%02d\n" $((max_num + 1)) >> "$GITHUB_OUTPUT"
          echo "next tag: R$(printf '%02d' $((max_num + 1)))"

  build-bakasu:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: naidrahiqa/kernel-ci-kit
          ref: main
          path: kit
      - name: Build bakasu
        id: kit
        uses: naidrahiqa/kernel-ci-kit@main
        with:
          defconfig: selene_defconfig
          device_name: selene
          toolchain: greenforce-clang
          extra_make_args: "LLVM=1 LLVM_IAS=1"
          config_overrides: "CONFIG_NOMOUNT=n"
          zip_name_template: 'PawwwNunungggg-bakasu-${{ needs.prepare.outputs.tag }}-{hash}-{date_ymd}'
      - name: Collect build statistics
        run: ./scripts/ci/build-stats.sh bakasu
        env:
          BUILD_SECONDS: ${{ steps.kit.outputs.build_seconds }}
          ZIP_PATH: ${{ steps.kit.outputs.zip_path }}
          CCACHE_HIT_RATE: ${{ steps.kit.outputs.ccache_hit_rate }}
          KERNEL_VERSION: ${{ steps.kit.outputs.kernel_version }}
      - name: Upload stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stats-bakasu
          path: stats/
          retention-days: 7

  build-bakasu-nomount-droidspaces:
    needs: [prepare, build-bakasu]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: naidrahiqa/kernel-ci-kit
          ref: main
          path: kit
      - name: Build bakasu-nomount-droidspaces
        id: kit
        uses: naidrahiqa/kernel-ci-kit@main
        with:
          defconfig: selene_defconfig
          device_name: selene
          toolchain: greenforce-clang
          extra_make_args: "LLVM=1 LLVM_IAS=1"
          config_overrides: "CONFIG_NOMOUNT=y"
          zip_name_template: 'PawwwNunungggg-bakasu-nomount-droidspaces-${{ needs.prepare.outputs.tag }}-{hash}-{date_ymd}'
      - name: Collect build statistics
        run: ./scripts/ci/build-stats.sh bakasu-nomount-droidspaces
        env:
          BUILD_SECONDS: ${{ steps.kit.outputs.build_seconds }}
          ZIP_PATH: ${{ steps.kit.outputs.zip_path }}
          CCACHE_HIT_RATE: ${{ steps.kit.outputs.ccache_hit_rate }}
          KERNEL_VERSION: ${{ steps.kit.outputs.kernel_version }}
      - name: Upload stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stats-bakasu-nomount-droidspaces
          path: stats/
          retention-days: 7


  release:
    needs: [prepare, build-bakasu, build-bakasu-nomount-droidspaces]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: naidrahiqa/kernel-ci-kit
          ref: main
          path: kit
      - name: Download kernel zips
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: PawwwNunungggg-*
          path: artifacts/
          merge-multiple: true
      - name: Download build stats
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: stats-*
          path: stats/
          merge-multiple: true
      - name: Create release (R##)
        id: rel
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: ./scripts/ci/release.sh
      - name: Notify Telegram (release + statistics)
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
          RELEASE_URL: ${{ steps.rel.outputs.url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '-1004414006944' }}
          TELEGRAM_TOPIC_CI: "47"
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1003752197403' }}
          KCK_SOURCE_REPO: naidrahiqa/android_kernel_xiaomi_mt6768-k419
          KCK_SOURCE_BRANCH: PawwwNunungggg24.0
          KCK_SOURCE_SHA: ${{ github.sha }}
        run: ./scripts/ci/notify-release.sh

  notify-failure:
    needs: [prepare, build-bakasu, build-bakasu-nomount-droidspaces, release]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: naidrahiqa/kernel-ci-kit
          ref: main
          path: kit
      - name: Notify failure
        env:
          RES_PREPARE: ${{ needs.prepare.result }}
          RES_BAKASU: ${{ needs.build-bakasu.result }}
          RES_BAKASU_NMD: ${{ needs.build-bakasu-nomount-droidspaces.result }}
          RES_RELEASE: ${{ needs.release.result }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '-1004414006944' }}
          TELEGRAM_TOPIC_CI: "47"
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1003752197403' }}
          KCK_SOURCE_REPO: naidrahiqa/android_kernel_xiaomi_mt6768-k419
          KCK_SOURCE_BRANCH: PawwwNunungggg24.0
          KCK_SOURCE_SHA: ${{ github.sha }}
        run: ./scripts/ci/notify-failure.sh
