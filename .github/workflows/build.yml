name: build

# Build on push to PawwwNunungggg24.0 — delegated to kernel-ci-kit.
#
# Why a thin wrapper: a workflow only reacts to events in ITS OWN repository,
# so kit's example-build.yml can never see a push here. The heavy lifting
# (toolchain cache, ccache, AK3 packaging, Telegram routing, release attach)
# lives in naidrahiqa/kernel-ci-kit; this file just supplies the trigger.

on:
  push:
    branches: [PawwwNunungggg24.0]
    paths-ignore:
      - '**.md'
      - '.opencode/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: Build kernel (kernel-ci-kit)
    uses: naidrahiqa/kernel-ci-kit/.github/workflows/example-build.yml@main
    with:
      kernel_repo: naidrahiqa/android_kernel_xiaomi_mt6768-k419
      kernel_ref: PawwwNunungggg24.0
      defconfig: selene_defconfig
      device_name: selene
      toolchain: greenforce-clang
      extra_make_args: LLVM=1 LLVM_IAS=1
      zip_name_template: 'PawwwNunungggg-{toolchain}-{hash}-{date}-{version}'
    secrets: inherit
